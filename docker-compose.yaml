---
services:

  sngrep:
    build:
      context: ./sngrep
      dockerfile: Dockerfile
    container_name: sngrep
    privileged: true  
    network_mode: host 
    environment:
      - TERM=xterm
    cap_add:
      - NET_ADMIN

  kamailio-edge:
    build:
      context: ./kamailio-default
      dockerfile: Dockerfile
    container_name: kamailio-edge
    ports:
      - "5090:5060"
    volumes:
      - ./kamailio-default/etc/kamailio/:/etc/kamailio
      - ./kamailio-default/etc/kamailio/my.cnf:/etc/my.cnf:ro
    environment:
      - KAM_SHM_MEM_SIZE=256
      - COREIP=172.16.254.2
      - CORESUBNET=172.16.254.1/24
      - TLSPORT=5061
      - UDPPORT=5060
      - PUBLICIP=192.168.254.2
      - DBUSERNAME=kamailio
      - DBPASSWORD=kamailiorw
      - DBHOST=172.16.254.10
      - DBNAME=kamailio

    networks:
      external:
        ipv4_address: 192.168.254.2
      internal:
        ipv4_address: 172.16.254.2

  rtpengine-edge:
    build:
      context: ./rtpengine-edge/docker
      dockerfile: Dockerfile
    container_name: rtpengine-edge
    ports:
      - "23000-23100:23000-23100"
    volumes:
      - ./rtpengine-edge/config:/etc/rtpengine
    networks:
      external:
        ipv4_address: 192.168.254.3
      internal:
        ipv4_address: 172.16.254.3


  b2bua_internal_01:
    tty: true
    container_name: b2bua_internal_01 
    stdin_open: true
    image: andrius/pjsua:latest
    command: pjsua --null-audio --no-tcp --auto-answer=404 --outbound sip:172.16.254.2;lr
    ports:
      - "5091:5060"
    networks:
      internal:
        ipv4_address: 172.16.254.100

  b2bua_internal_02:
    tty: true
    container_name: b2bua_internal_02 
    stdin_open: true
    image: andrius/pjsua:latest
    command: pjsua --null-audio --no-tcp --auto-answer=200 --outbound sip:172.16.254.2;lr
    ports:
      - "5092:5060"
    networks:
      internal:
        ipv4_address: 172.16.254.101

  b2bua_external_01:
    tty: true
    container_name: b2bua_external_01
    stdin_open: true
    image: andrius/pjsua:latest
    command: pjsua --null-audio --no-tcp  --outbound sip:192.168.254.2;lr
    ports:
      - "5093:5060"
    networks:
      external:
        ipv4_address: 192.168.254.100

  db:
    image: mysql:8.4
    restart: always
    container_name: db01
    environment:
      MYSQL_DATABASE: 'kamailio'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'ro_password'
      MYSQL_ROOT_PASSWORD: 'rw_password'
    command:
      - "--require-secure-transport=ON"
      - "--mysql-native-password=ON"
      - "--authentication_policy=mysql_native_password"
      - "--ssl-ca=/etc/mysql/ssl/ca.crt"
      - "--ssl-cert=/etc/mysql/ssl/server.crt"
      - "--ssl-key=/etc/mysql/ssl/server.key"
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      # Clear data storage block
      - ./db:/var/lib/mysql
      # FIX: Mount your custom certificates safely outside the data volume
      - ./db-certs:/etc/mysql/ssl
    networks:
      internal:
        ipv4_address: 172.16.254.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p=rw_password"]
      timeout: 5s
      retries: 10
      interval: 3s

networks:
    external:
        # use the bridge driver, but enable IPv6
        ipam:
            config:
                - subnet: 192.168.254.0/24
                  gateway: 192.168.254.1
    internal:
        # use a custom driver, with no options
        ipam:
            config:
                - subnet: 172.16.254.0/24
                  gateway: 172.16.254.1
